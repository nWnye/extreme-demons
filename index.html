    <style>

      * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0d080d;
    color: #f2f2f2;
    min-height: 100vh;
}


/* =========================
   HEADER
========================= */

header {
    position: relative;

    padding: 55px 20px 40px;
    text-align: center;

    background:
        radial-gradient(
            circle at top,
            #2d102e 0%,
            #0d080d 60%
        );

    border-bottom: 1px solid #241824;
}

header h1 {
    font-size: 44px;
    font-weight: 800;
    letter-spacing: -2px;
}

header h1 span {
    color: #fa6fff;
}

header p {
    margin-top: 10px;
    color: #827782;
}


/* =========================
   SOCIAL LINKS
========================= */

.social-links {
    position: absolute;

    top: 20px;
    right: 25px;

    display: flex;
    flex-direction: row;
    align-items: center;

    gap: 14px;
}

.social-links a {
    display: flex;

    width: 38px;
    height: 38px;

    transition: 0.2s;
}

.social-links a:hover {
    transform: translateY(-2px) scale(1.08);
}

.social-links img {
    width: 100%;
    height: 100%;

    object-fit: contain;
}


/* =========================
   STATS
========================= */

.stats {
    max-width: 1100px;

    margin: 30px auto;

    padding: 0 20px;

    display: grid;
    grid-template-columns: repeat(3, 1fr);

    gap: 15px;
}

.stat {
    background: #131014;

    border: 1px solid #231b24;
    border-radius: 14px;

    padding: 22px;

    text-align: center;

    transition: 0.2s;
}

.stat:hover {
    border-color: #3d283d;
    transform: translateY(-1px);
}

.stat-number {
    font-size: 28px;
    font-weight: 800;

    color: #f47bff;
}

.stat-label {
    margin-top: 5px;

    color: #827782;

    font-size: 13px;
}


/* =========================
   MAIN CONTAINER
========================= */

.container {
    max-width: 1100px;

    margin: auto;

    padding: 10px 20px 60px;
}

.section-title {
    color: #827782;

    font-size: 13px;

    text-transform: uppercase;

    letter-spacing: 1px;

    margin-bottom: 15px;
}


/* =========================
   SEARCH / SORT
========================= */

.search-controls {
    display: flex;

    gap: 12px;

    margin-bottom: 25px;
}

#levelSearch,
#levelSort {
    background: #120e12;

    border: 1px solid #29202a;

    border-radius: 12px;

    color: #f2f2f2;

    font-size: 14px;

    outline: none;

    transition: 0.2s;
}

#levelSearch {
    flex: 1;

    padding: 14px 16px;
}

#levelSort {
    padding: 14px 42px 14px 16px;

    cursor: pointer;
}

#levelSearch::placeholder {
    color: #776b76;
}

#levelSearch:focus,
#levelSort:focus {
    border-color: #663b67;
}

#levelSort option {
    background: #120e12;
    color: #f2f2f2;
}


/* =========================
   LEVEL
========================= */

.level {
    background: #141014;

    border: 1px solid #231b24;

    border-radius: 14px;

    margin-bottom: 10px;

    overflow: hidden;

    transition: 0.2s;
}

.level:hover {
    border-color: #433044;

    transform: translateY(-1px);
}

.level-header {
    display: flex;

    align-items: center;

    padding: 17px 18px;

    cursor: pointer;

    user-select: none;
}

.rank {
    width: 55px;

    color: #6a616a;

    font-size: 13px;

    font-weight: bold;
}

.level-info {
    flex: 1;
}

.level-name {
    font-size: 16px;

    font-weight: 700;
}

.publisher {
    color: #746c75;

    font-size: 12px;

    margin-top: 4px;
}

.arrow {
    color: #746c75;

    transition: 0.25s;

    font-size: 13px;
}

.level.open .arrow {
    transform: rotate(180deg);
}


/* =========================
   LEVEL DETAILS
========================= */

.level-details {
    max-height: 0;

    overflow: hidden;

    transition: max-height 0.35s ease;
}

.details-content {
    border-top: 1px solid #241b24;

    padding: 20px;

    display: grid;

    grid-template-columns: 1fr;

    gap: 20px;
}

.details-grid {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 12px;
}

.detail {
    background: #0e0b0e;

    border: 1px solid #211a21;

    border-radius: 10px;

    padding: 12px;
}

.detail-label {
    color: #6e666f;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: 0.5px;
}

.detail-value {
    margin-top: 5px;

    font-size: 14px;

    font-weight: 600;
}

.notes {
    grid-column: 1 / -1;
}

.notes .detail-value {
    color: #aaa3aa;

    font-weight: normal;

    line-height: 1.5;
}


/* =========================
   VIDEO
========================= */

.video-container {
    width: 100%;

    max-width: 750px;

    aspect-ratio: 16 / 9;

    background: #0e0b0e;

    border: 1px solid #211a21;

    border-radius: 12px;

    overflow: hidden;

    margin-top: 5px;
}

.video-container iframe {
    width: 100%;
    height: 100%;

    border: none;
}


/* =========================
   NO RESULTS
========================= */

.no-results {
    text-align: center;

    padding: 40px 20px;

    color: #6f666f;

    font-size: 14px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    header h1 {
        font-size: 32px;
    }

    .social-links {
        top: 15px;
        right: 15px;
    }

    .social-links a {
        width: 32px;
        height: 32px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .search-controls {
        flex-direction: column;
    }

    #levelSort {
        width: 100%;
    }

    .details-content {
        grid-template-columns: 1fr;
    }

    .details-grid {
        grid-template-columns: 1fr 1fr;
    }

    .video-container {
        max-width: 100%;
    }

    .rank {
        width: 45px;
    }
}

        /* ============================================
           DATE PARSER

           Handles:
           Jan 29th, 2024
           Jul 13th, 2024
           Feb 23rd, 2026
           etc.
        ============================================ */

        function parseDate(dateString) {

            const cleanedDate =
                dateString.replace(
                    /(\d+)(st|nd|rd|th)/i,
                    "$1"
                );

            return new Date(cleanedDate);
        }


        /* ============================================
           YOUTUBE EMBED
        ============================================ */

        function getYoutubeEmbed(url) {

            if (!url) {
                return "";
            }

            try {

                const parsedUrl = new URL(url);

                let videoId = "";


                if (
                    parsedUrl.hostname.includes("youtube.com") &&
                    parsedUrl.searchParams.get("v")
                ) {

                    videoId =
                        parsedUrl.searchParams.get("v");

                }


                else if (
                    parsedUrl.hostname === "youtu.be"
                ) {

                    videoId =
                        parsedUrl.pathname.substring(1);

                }


                else if (
                    parsedUrl.hostname.includes("youtube.com") &&
                    parsedUrl.pathname.startsWith("/shorts/")
                ) {

                    videoId =
                        parsedUrl.pathname
                            .split("/shorts/")[1]
                            .split("/")[0];

                }


                if (!videoId) {
                    return "";
                }


                return `https://www.youtube-nocookie.com/embed/${videoId}`;

            }

            catch (error) {

                return "";

            }

        }


        /* ============================================
           DISPLAY LEVELS
        ============================================ */

        function displayLevels(levelArray) {

            const levelList =
                document.getElementById("levelList");


            levelList.innerHTML = "";


            if (levelArray.length === 0) {

                levelList.innerHTML = `
                    <div class="no-results">
                        No levels found.
                    </div>
                `;

                return;

            }


            levelArray.forEach(level => {

                /*
                    Find the original ranking.

                    This means sorting by enjoyment/date/etc.
                    does NOT change the actual difficulty rank.
                */

                const rank =
                    levels.indexOf(level) + 1;


                const levelElement =
                    document.createElement("div");


                levelElement.className = "level";


                const videoEmbed =
                    getYoutubeEmbed(level.video);


                levelElement.innerHTML = `

                    <div
                        class="level-header"
                        onclick="toggleLevel(this)"
                    >

                        <div class="rank">
                            #${rank}
                        </div>


                        <div class="level-info">

                            <div class="level-name">
                                ${level.name}
                            </div>

                            <div class="publisher">
                                by ${level.publisher}
                            </div>

                        </div>


                        <div class="arrow">
                            ▼
                        </div>

                    </div>


                    <div class="level-details">

                        <div class="details-content">

                            <div class="details-grid">


                                <div class="detail">

                                    <div class="detail-label">
                                        position
                                    </div>

                                    <div class="detail-value">
                                        #${rank}
                                    </div>

                                </div>


                                <div class="detail">

                                    <div class="detail-label">
                                        attempts
                                    </div>

                                    <div class="detail-value">
                                        ${level.attempts.toLocaleString()}
                                    </div>

                                </div>


                                <div class="detail">

                                    <div class="detail-label">
                                        enjoyment
                                    </div>

                                    <div class="detail-value">
                                        ${level.enjoyment}
                                    </div>

                                </div>


                                <div class="detail">

                                    <div class="detail-label">
                                        completion date
                                    </div>

                                    <div class="detail-value">
                                        ${level.date}
                                    </div>

                                </div>


                                <div class="detail">

                                    <div class="detail-label">
                                        furthest death
                                    </div>

                                    <div class="detail-value">
                                        ${level.furthestDeath}
                                    </div>

                                </div>


                                <div class="detail notes">

                                    <div class="detail-label">
                                        notes
                                    </div>

                                    <div class="detail-value">
                                        ${level.notes}
                                    </div>

                                </div>


                            </div>


                            ${
                                videoEmbed
                                ?
                                `
                                <div class="video-container">

                                    <iframe
                                        src="${videoEmbed}"
                                        title="${level.name} completion video"
                                        loading="lazy"
                                        referrerpolicy="strict-origin-when-cross-origin"
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                        allowfullscreen>
                                    </iframe>

                                </div>
                                `
                                :
                                ""
                            }


                        </div>

                    </div>

                `;


                levelList.appendChild(levelElement);

            });

        }


        /* ============================================
           SEARCH + SORT
        ============================================ */

        function updateLevelList() {

            const searchTerm =
                document
                    .getElementById("levelSearch")
                    .value
                    .toLowerCase()
                    .trim();


            const sortType =
                document
                    .getElementById("levelSort")
                    .value;


            /*
                IMPORTANT:

                Create a new array using filter().
                This prevents sorting from permanently
                changing the original levels array.
            */

            let filteredLevels =
                levels.filter(level =>
                    level.name
                        .toLowerCase()
                        .includes(searchTerm)
                );


            /* =========================
               HARDEST → EASIEST
            ========================= */

            if (sortType === "default") {

                filteredLevels.sort(
                    (a, b) =>
                        levels.indexOf(a) -
                        levels.indexOf(b)
                );

            }


            /* =========================
               EASIEST → HARDEST
            ========================= */

            else if (sortType === "easy") {

                filteredLevels.sort(
                    (a, b) =>
                        levels.indexOf(b) -
                        levels.indexOf(a)
                );

            }


            /* =========================
               ENJOYMENT HIGH → LOW
            ========================= */

            else if (sortType === "high") {

                filteredLevels.sort(
                    (a, b) =>
                        parseInt(b.enjoyment) -
                        parseInt(a.enjoyment)
                );

            }


            /* =========================
               ENJOYMENT LOW → HIGH
            ========================= */

            else if (sortType === "low") {

                filteredLevels.sort(
                    (a, b) =>
                        parseInt(a.enjoyment) -
                        parseInt(b.enjoyment)
                );

            }


            /* =========================
               ATTEMPTS HIGH → LOW
            ========================= */

            else if (sortType === "attempts-high") {

                filteredLevels.sort(
                    (a, b) =>
                        b.attempts -
                        a.attempts
                );

            }


            /* =========================
               ATTEMPTS LOW → HIGH
            ========================= */

            else if (sortType === "attempts-low") {

                filteredLevels.sort(
                    (a, b) =>
                        a.attempts -
                        b.attempts
                );

            }


            /* =========================
               FURTHEST DEATH HIGH → LOW
            ========================= */

            else if (sortType === "death-high") {

                filteredLevels.sort(
                    (a, b) =>
                        parseInt(b.furthestDeath) -
                        parseInt(a.furthestDeath)
                );

            }


            /* =========================
               FURTHEST DEATH LOW → HIGH
            ========================= */

            else if (sortType === "death-low") {

                filteredLevels.sort(
                    (a, b) =>
                        parseInt(a.furthestDeath) -
                        parseInt(b.furthestDeath)
                );

            }


            /* =========================
               DATE OLDEST → LATEST
            ========================= */

            else if (sortType === "date-old") {

                filteredLevels.sort(
                    (a, b) =>
                        parseDate(a.date) -
                        parseDate(b.date)
                );

            }


            /* =========================
               DATE LATEST → OLDEST
            ========================= */

            else if (sortType === "date-new") {

                filteredLevels.sort(
                    (a, b) =>
                        parseDate(b.date) -
                        parseDate(a.date)
                );

            }


            displayLevels(filteredLevels);

        }


        /* ============================================
           EXPAND / COLLAPSE LEVEL
        ============================================ */

        function toggleLevel(header) {

            const level =
                header.parentElement;


            const details =
                level.querySelector(".level-details");


            /*
                Close every other open level.
            */

            document
                .querySelectorAll(".level.open")
                .forEach(openLevel => {

                    if (openLevel !== level) {

                        openLevel.classList.remove("open");

                        openLevel
                            .querySelector(".level-details")
                            .style.maxHeight = null;

                    }

                });


            level.classList.toggle("open");


            if (level.classList.contains("open")) {

                details.style.maxHeight =
                    details.scrollHeight + "px";

            }

            else {

                details.style.maxHeight = null;

            }

        }


        /* ============================================
           SEARCH EVENT
        ============================================ */

        document
            .getElementById("levelSearch")
            .addEventListener(
                "input",
                updateLevelList
            );


        /* ============================================
           SORT EVENT
        ============================================ */

        document
            .getElementById("levelSort")
            .addEventListener(
                "change",
                updateLevelList
            );


        /* ============================================
           STATS
        ============================================ */

        document
            .getElementById("totalLevels")
            .textContent =
            levels.length;


        const averageEnjoyment =
            levels.length > 0

                ? levels.reduce(
                    (total, level) =>
                        total +
                        parseInt(level.enjoyment),

                    0

                ) / levels.length

                : 0;


        document
            .getElementById("averageEnjoyment")
            .textContent =
            `${averageEnjoyment.toFixed(1)}/100`;


        const totalAttempts =
            levels.reduce(
                (total, level) =>
                    total + level.attempts,

                0
            );


        document
            .getElementById("totalAttempts")
            .textContent =
            totalAttempts.toLocaleString();


        /* ============================================
           INITIAL DISPLAY
        ============================================ */

        updateLevelList();


    </script>
